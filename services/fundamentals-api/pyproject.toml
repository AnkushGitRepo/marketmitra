[project]
name = "fundamentals-api"
version = "0.1.0"
description = "MarketMitra fundamentals data service — screener.in-style ratios, financial statements, shareholding, and documents, served over FastAPI from a three-tier free-data-source fallback chain."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "polars>=1.12",
  "httpx>=0.27",
  "orjson>=3.10",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "nsepython>=2.93",
  "bsedata>=0.6",
  "yfinance>=0.2.44",
  "feedparser>=6.0",
  "vaderSentiment>=3.3",
  "pdfplumber>=0.11",
  "camelot-py>=1.0",
  "opencv-python-headless>=4.10",
  "scrapling[fetchers]>=0.4.15",
  "lxml>=5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only `app/` is an installable package — `migrations/` is Alembic's
# script directory (run via `alembic upgrade head`, never imported), and
# without this setuptools' auto-discovery finds both as top-level
# packages in this flat layout and refuses to guess (`pip install -e .`
# fails with "Multiple top-level packages discovered").
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-default-argument is the documented, idiomatic
# pattern (not the footgun this bugbear rule usually flags) — see
# https://fastapi.tiangolo.com/tutorial/dependencies/
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# DTZ011 (naive date.today()): fine in tests — they only need a plausible
# "today" for fixtures, not real timezone correctness.
"tests/*" = ["DTZ011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "network: test makes a live network call to an external data source",
]
