# Runs the same checks required before any commit lands. No secrets required —
# nothing here touches a live external integration.
#
#   build:  the Next.js app — lint, type-check, unit tests, production build.
#   python: the fundamentals-api service's pytest suite, installed from the same
#           requirements.txt that production deploys from, so a dependency update
#           (Dependabot's pip PRs included) is actually exercised.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        # MONGODB_URI/MONGODB_DB only need to be *set* — the build collects
        # route config at build time but never opens a real connection.
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB: "marketmitra"
        run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/fundamentals-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/fundamentals-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Unit tests
        run: python -m pytest -q

