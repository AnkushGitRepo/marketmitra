# Out-of-band bulk screener-universe refresh for MarketMitra (ADR 0025).
#
# Every other table in fundamentals-api is populated lazily, one company at
# a time, only when a user views that company's page. A screener needs
# criteria data across most of the ~2,570-company NSE universe to be
# useful — this job scrapes Screener.in directly (plain httpx, no headless
# browser needed — see scraper.py's own docstring) and POSTs results to
# POST /screener/ingest.
#
# INCREMENTAL, not full: each scheduled run refreshes only the ~400 companies
# whose Screener.in fundamentals are missing or oldest (`--stale-first`), so the
# whole universe cycles roughly weekly instead of being re-scraped every day.
# Fundamentals change quarterly. Price-derived fields (market cap, P/E, P/B,
# dividend yield) come from refresh-screener-quotes.yml instead. For the
# one-time backfill, run this workflow manually with `full` ticked.
#
# ACTIVATION (one-time):
#   1. GitHub runs `schedule:` only from the DEFAULT branch — until this
#      repo's app branch is the default, only the manual "Run workflow"
#      button fires.
#   2. Repo secret:  gh secret set SCREENER_INGEST_TOKEN
#      (same value as SCREENER_INGEST_TOKEN on the fundamentals-api Vercel project)
#   3. Repo variable: FUNDAMENTALS_API_URL
#      (e.g. https://marketmitra-fundamentals-api.vercel.app) — or the job
#      falls back to the default below.

name: refresh-screener

on:
  schedule:
    # Once daily, 20:30 UTC (~02:00 IST, off-peak) — fundamentals (P/E, ROE,
    # market cap) don't need same-day freshness the way IPO GMP does; the
    # ratios table elsewhere in this service already uses a 24h TTL.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Backfill: scrape the ENTIRE universe (~21 min) instead of the stalest 400"
        type: boolean
        default: false
      limit:
        description: "Override the number of companies to refresh (leave empty for the default)"
        required: false
        default: ""

concurrency:
  group: refresh-screener
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full backfill is ~2,570 symbols at 2 req/s =~ 21 minutes; the daily
    # incremental run (400 symbols) takes ~4. Headroom covers retry backoff.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/fundamentals-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --quiet httpx "scrapling>=0.4.15" "lxml>=5.3"

      - name: Scrape + ingest
        env:
          FUNDAMENTALS_API_URL: ${{ vars.FUNDAMENTALS_API_URL || 'https://marketmitra-fundamentals-api.vercel.app' }}
          SCREENER_INGEST_TOKEN: ${{ secrets.SCREENER_INGEST_TOKEN }}
        run: |
          if [ -z "$SCREENER_INGEST_TOKEN" ]; then
            echo "::error::SCREENER_INGEST_TOKEN secret is not set — see this workflow's ACTIVATION notes."
            exit 1
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          FULL="${{ github.event.inputs.full }}"
          if [ "$FULL" = "true" ]; then
            python scripts/refresh_screener_universe.py
          else
            python scripts/refresh_screener_universe.py --stale-first --limit "${LIMIT:-400}"
          fi
